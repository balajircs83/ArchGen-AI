<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArchGen AI - System Architecture Generator</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link href="https://cdn.jsdelivr.net/npm/reactflow/dist/style.min.css" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: Object.fromEntries(['app', 'surface', 'surface2', 'line', 'fg', 'muted', 'accent', 'accent-soft', 'accent-fg']
            .map((k) => [k, `rgb(var(--${k}) / <alpha-value>)`])),
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root, [data-theme="light"] {
      --app: 243 242 238; --surface: 255 255 255; --surface2: 246 245 241; --line: 230 228 220;
      --fg: 22 24 29; --muted: 107 111 118; --accent: 200 241 105; --accent-soft: 238 250 208; --accent-fg: 26 46 5;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --app: 15 17 21; --surface: 23 26 32; --surface2: 30 34 42; --line: 42 47 57;
      --fg: 236 238 242; --muted: 139 145 160; --accent: 200 241 105; --accent-soft: 36 48 22; --accent-fg: 26 46 5;
      color-scheme: dark;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgb(var(--line)); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgb(var(--muted)); }
    .react-flow__controls-button { background: rgb(var(--surface)) !important; border-color: rgb(var(--line)) !important; fill: rgb(var(--fg)) !important; }
    .react-flow__controls-button svg { fill: rgb(var(--fg)) !important; }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "reactflow": "https://aistudiocdn.com/reactflow@^11.11.4",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "dagre": "https://aistudiocdn.com/dagre@^0.8.5",
    "html-to-image": "https://aistudiocdn.com/html-to-image@^1.11.11",
    "jspdf": "https://aistudiocdn.com/jspdf@^2.5.1",
    "gifshot": "https://unpkg.com/gifshot@0.4.5/build/gifshot.min.js",
    "react-markdown": "https://esm.sh/react-markdown@9",
    "remark-gfm": "https://esm.sh/remark-gfm@4"
  }
}
</script>
</head>

<body class="bg-app text-fg font-sans overflow-hidden">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
